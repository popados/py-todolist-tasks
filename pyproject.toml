[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklist"
version = "0.1.0"
description = "A simple command-line task manager"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
tasks = "tasklist.main:main"
